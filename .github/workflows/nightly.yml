# Standings updates: every 30 minutes through the game window (16:00 to
# 08:00 UTC), a daily safety net at 10:23 UTC, and "Run workflow". A run
# commits only when something changed: a new final counted, a snapshot, the
# payroll, or a pregame entry for a game not yet started.
name: Nightly standings

on:
  schedule:
    - cron: '*/30 16-23 * * *'   # 16:00-23:30 UTC
    - cron: '*/30 0-7 * * *'     # 00:00-07:30 UTC
    - cron: '0 8 * * *'          # 08:00 UTC, the last of the window
    - cron: '23 10 * * *'        # 10:23 UTC = 6:23 a.m. ET, daily safety net
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly-standings
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The safety net and manual runs refresh the standings and payroll even
      # when no new final shows on the scoreboard.
      FORCE: ${{ (github.event_name == 'workflow_dispatch' || github.event.schedule == '23 10 * * *') && '--force' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Informational, on forced runs only (the 30-minute runs skip it rather
      # than pull the full season schedule twice an hour). Same request and
      # parsing code as the update (scripts/probe.mjs runs fetch.mjs's
      # sources), so a passing probe means the update gets that source.
      - name: Probe feeds
        if: env.FORCE == '--force'
        continue-on-error: true
        run: node scripts/probe.mjs

      - name: Unit tests
        run: |
          node test/metrics.test.mjs
          node test/http.test.mjs
          node test/phase1.test.mjs

      # Fails the run (and so the failure email) when every standings source
      # fails; nothing but pregame entries is written in that case, and the
      # steps below do not run.
      - name: Update
        run: node scripts/update.mjs $FORCE

      - name: Page tests
        run: node test/data-and-page.test.mjs

      - name: Commit if anything changed
        run: |
          git add data index.html sitemap.xml
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --cached --quiet -- index.html; then msg="Pregame archive"; else msg="Standings update"; fi
          git commit -m "$msg $(TZ=America/New_York date '+%F %H:%M ET')"
          git pull --rebase origin main
          git push
