# Nightly: fetch standings and payroll, rebuild the page and the sitemap,
# commit only when something changed. Also runs from the Actions tab
# ("Run workflow").
name: Nightly standings

on:
  schedule:
    - cron: '23 10 * * *'   # 10:23 UTC = 6:23 a.m. ET, after the last West Coast final
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly-standings
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Informational: shows in the log whether each source answers from
      # GitHub's runners, using the same request and parsing code as the
      # fetch below (scripts/probe.mjs runs fetch.mjs's SOURCES).
      - name: Probe feeds
        continue-on-error: true
        run: node scripts/probe.mjs

      - name: Unit tests
        run: |
          node test/metrics.test.mjs
          node test/http.test.mjs

      # Fails the run (and so the failure email) when every standings source
      # fails; it writes nothing in that case, so nothing below runs and the
      # committed data and page stay as they were.
      - name: Fetch standings and payroll
        run: node scripts/fetch.mjs

      - name: Build page and sitemap
        run: node scripts/build.mjs

      - name: Page tests
        run: node test/data-and-page.test.mjs

      - name: Commit if anything changed
        run: |
          git add data index.html sitemap.xml
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Standings update $(TZ=America/New_York date +%F)"
          git push
