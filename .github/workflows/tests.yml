name: Tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node test/metrics.test.mjs
      - run: node test/data-and-page.test.mjs
      - run: node test/http.test.mjs
      - run: node test/phase1.test.mjs
